<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sealGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#DE4E35"/>
      <stop offset="60%" stop-color="#C23B22"/>
      <stop offset="100%" stop-color="#9E2A15"/>
    </radialGradient>
    <filter id="inkTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Stamp Canvas with Hanji Warm Backdrop -->
  <rect width="512" height="512" rx="112" fill="#FCFAF6"/>
  
  <!-- Main Vermilion Stamp Seal Body -->
  <rect x="48" y="48" width="416" height="416" rx="88" fill="url(#sealGrad)" filter="url(#inkTexture)"/>
  
  <!-- Inner Ornamental Double Border Ring -->
  <rect x="76" y="76" width="360" height="360" rx="64" fill="none" stroke="#FFEAE6" stroke-width="12" stroke-opacity="0.85"/>
  <rect x="94" y="94" width="324" height="324" rx="48" fill="none" stroke="#FFEAE6" stroke-width="4" stroke-opacity="0.6"/>
  
  <!-- Traditional Korean Hanja 印 Seal Character (Carefully structured geometric curves) -->
  <g fill="#FFFFFF" opacity="0.96">
    <!-- Left Stem and Hook of 印 -->
    <path d="M190 148 h36 v216 h-36 z"/>
    <path d="M190 148 h124 v36 h-124 z"/>
    <path d="M278 176 h36 v116 h-36 z"/>
    <path d="M226 260 h88 v34 h-88 z"/>
    <!-- Right side radical stroke and hook -->
    <path d="M336 210 h36 v150 c0 16 -12 28 -28 28 h-56 v-34 h48 v-144 z"/>
  </g>
</svg>
